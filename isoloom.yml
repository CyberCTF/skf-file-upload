# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Unrestricted File Upload (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask upload form that keeps the client's file name and allows HTML files (unrestricted file upload). The SKF lab folder python/File-upload is
# vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-file-upload

networks:
  lab: { cidr: 10.60.143.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5000, name: web, http: true, publish: 5050 }]
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: app

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: a .txt upload is accepted
    script: checks/upload.sh

message: |
  OWASP SKF Unrestricted File Upload answers at http://localhost:{{ machines.web.services.0.publish }}/.
  The upload keeps the name you send. Which names and extensions does it really allow?
